<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Dynatrace All File Manager">
  <defs>
    <!-- Dynatrace purple-to-blue plate -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6F2DA8" />
      <stop offset="55%"  stop-color="#4A3AC8" />
      <stop offset="100%" stop-color="#1496FF" />
    </linearGradient>

    <!-- Folder body, slightly lighter front face for depth -->
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFC857" />
      <stop offset="100%" stop-color="#E89B1E" />
    </linearGradient>
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E89B1E" />
      <stop offset="100%" stop-color="#B97509" />
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" />
      <feOffset dx="0" dy="1.5" result="b" />
      <feComponentTransfer><feFuncA type="linear" slope="0.35" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background plate -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)" />
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1" />

  <!-- Five color-coded file tabs peeking from behind the folder.
       One per managed type: notebook, dashboard, lookup, launchpad, document.
       Drawn first so the folder front covers their lower halves. -->
  <g filter="url(#soft)">
    <!-- Notebook (Dynatrace blue) -->
    <rect x="22" y="36" width="16" height="22" rx="2" fill="#1496FF" />
    <!-- Dashboard (teal) -->
    <rect x="40" y="32" width="16" height="26" rx="2" fill="#2DD4BF" />
    <!-- Lookup (green) -->
    <rect x="58" y="28" width="16" height="30" rx="2" fill="#65D26B" />
    <!-- Launchpad (amber accent — distinct from folder body via dark outline) -->
    <rect x="76" y="32" width="16" height="26" rx="2" fill="#F472B6" />
    <!-- Document (light lavender) -->
    <rect x="94" y="36" width="14" height="22" rx="2" fill="#C4B5FD" />
  </g>

  <!-- Folder back lip with tab -->
  <path d="M 18 48
           h 28
           l 6 -8
           h 60
           a 4 4 0 0 1 4 4
           v 8
           h -98
           z"
        fill="url(#folderBack)" />

  <!-- Folder front pocket (rounded rectangle that covers tab lower halves) -->
  <path d="M 18 54
           h 92
           a 4 4 0 0 1 4 4
           v 38
           a 6 6 0 0 1 -6 6
           h -88
           a 6 6 0 0 1 -6 -6
           v -38
           a 4 4 0 0 1 4 -4
           z"
        fill="url(#folderFront)" />

  <!-- Subtle highlight line along the top of the folder front -->
  <path d="M 18 56 h 96"
        stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round" />
</svg>
