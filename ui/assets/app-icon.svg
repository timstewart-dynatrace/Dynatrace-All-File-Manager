<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Dynatrace All File Manager">
  <defs>
    <!-- Dynatrace-platform purple to blue -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6F2DA8" />
      <stop offset="55%" stop-color="#4A3AC8" />
      <stop offset="100%" stop-color="#1496FF" />
    </linearGradient>

    <!-- Subtle highlight on the surface of each document -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8ECF7" />
    </linearGradient>

    <!-- Soft shadow under the fanned stack -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" />
      <feOffset dx="0" dy="1.2" result="b" />
      <feComponentTransfer><feFuncA type="linear" slope="0.35" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Folded-corner document path, drawn at origin with size 48x60. -->
    <symbol id="doc" viewBox="0 0 48 60" overflow="visible">
      <!-- main body with folded top-right corner -->
      <path d="M 4 0 H 34 L 48 14 V 56 A 4 4 0 0 1 44 60 H 4 A 4 4 0 0 1 0 56 V 4 A 4 4 0 0 1 4 0 Z"
            fill="url(#paper)" />
      <!-- fold triangle -->
      <path d="M 34 0 V 10 A 4 4 0 0 0 38 14 H 48 Z" fill="#C7CFE6" />
    </symbol>
  </defs>

  <!-- Background plate -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)" />

  <!-- Inner glow ring (very subtle) -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

  <!-- Fanned stack: back-left, back-right, then front document -->
  <g filter="url(#cardShadow)">
    <g transform="translate(64 70) rotate(-14) translate(-24 -30)">
      <use href="#doc" opacity="0.78" />
    </g>
    <g transform="translate(64 70) rotate(14) translate(-24 -30)">
      <use href="#doc" opacity="0.88" />
    </g>
    <g transform="translate(64 68) translate(-24 -30)">
      <use href="#doc" />
      <!-- Content lines on the front document — hints at "files with content" -->
      <rect x="8"  y="24" width="22" height="3" rx="1.5" fill="#1496FF" opacity="0.85" />
      <rect x="8"  y="32" width="32" height="2" rx="1"   fill="#6F2DA8" opacity="0.55" />
      <rect x="8"  y="38" width="28" height="2" rx="1"   fill="#6F2DA8" opacity="0.40" />
      <rect x="8"  y="44" width="20" height="2" rx="1"   fill="#6F2DA8" opacity="0.30" />
    </g>
  </g>
</svg>
